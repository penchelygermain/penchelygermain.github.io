# Configuration de l’espace d’administration (Sveltia CMS).
# Fichier généré : modifiez-le seulement si vous savez ce que vous faites.

backend:
  name: github
  repo: penchelygermain/penchelygermain.github.io
  branch: main
  commit_messages:
    create: 'Ajout : {{collection}} « {{slug}} »'
    update: 'Mise à jour : {{collection}} « {{slug}} »'
    delete: 'Suppression : {{collection}} « {{slug}} »'
    uploadMedia: Envoi du fichier « {{path}} »
    deleteMedia: Suppression du fichier « {{path}} »
site_url: https://penchelygermain.github.io
display_url: https://penchelygermain.github.io
logo_url: /assets/icons/favicon.svg
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
- name: reglages
  format: json
  label: ⚙️ Réglages
  description: E-mail, photo, CV, réseaux sociaux, vidéo, formulaire de contact.
  files:
  - name: site
    label: Réglages généraux
    file: data/site.json
    fields:
    - name: name
      label: Nom affiché
      widget: string
      required: true
    - name: roles
      label: Mes métiers (en haut de l’accueil)
      widget: list
      required: false
      field:
        name: item
        label: Élément
        widget: string
    - name: tagline
      label: Signature (sous le nom, pied de page)
      widget: string
      required: false
    - name: email
      label: E-mail public
      widget: string
      required: false
    - name: location
      label: Localisation (ville, pays — jamais l’adresse exacte)
      widget: string
      required: false
    - name: photo
      label: Photo professionnelle
      widget: image
      required: false
      hint: Portrait vertical, idéalement 800 × 1000 px, moins de 300 Ko.
    - name: photoAlt
      label: Description de la photo (accessibilité)
      widget: string
      required: false
    - name: cvPdf
      label: CV (PDF)
      widget: file
      required: false
    - name: mediaKitPdf
      label: Media kit (PDF, facultatif)
      widget: file
      required: false
    - name: featuredVideo
      label: Vidéo de présentation (YouTube)
      widget: string
      required: false
      hint: 'Identifiant YouTube seulement : pour https://www.youtube.com/watch?v=AbC123xyz, écrivez AbC123xyz.'
    - name: geoHagriUrl
      label: Adresse de POLE GEO-HAGRI
      widget: string
      required: false
    - name: formEndpoint
      label: Adresse du formulaire de contact (Formspree)
      widget: string
      required: false
      hint: Ex. https://formspree.io/f/abcdwxyz
    - name: socials
      label: Réseaux sociaux (adresse complète, vide = masqué)
      widget: object
      required: false
      fields:
      - name: linkedin
        label: LinkedIn
        widget: string
        required: false
      - name: facebook
        label: Facebook
        widget: string
        required: false
      - name: instagram
        label: Instagram
        widget: string
        required: false
      - name: youtube
        label: YouTube
        widget: string
        required: false
      - name: tiktok
        label: TikTok
        widget: string
        required: false
      - name: x
        label: X (Twitter)
        widget: string
        required: false
      - name: researchgate
        label: ResearchGate
        widget: string
        required: false
      - name: scholar
        label: Google Scholar
        widget: string
        required: false
      - name: github
        label: GitHub
        widget: string
        required: false
    - name: showPlaceholders
      label: Afficher les éléments « À COMPLÉTER »
      widget: boolean
      required: false
      hint: 'Décochez quand le site est prêt à être présenté : les exemples et notes disparaissent.'
      default: true
    - name: showTestimonials
      label: Afficher la section Témoignages
      widget: boolean
      required: false
      default: true
    - name: analytics
      label: Statistiques de visite (facultatif)
      widget: object
      required: false
      fields:
      - name: provider
        label: Service
        widget: string
        required: false
        hint: goatcounter ou cloudflare (laisser vide = désactivé)
      - name: code
        label: Code GoatCounter
        widget: string
        required: false
      - name: token
        label: Jeton Cloudflare
        widget: string
        required: false
      collapsed: true
- name: contenus
  format: json
  label: 📚 Contenus
  description: Projets, blog, formations, publications, médias, documents, parcours…
  files:
  - name: projects
    label: Projets
    file: data/projects.json
    fields:
    - name: projects
      label: Projets
      widget: list
      required: false
      fields:
      - name: id
        label: Identifiant
        widget: string
        required: true
        hint: Identifiant unique, en minuscules, sans espace ni accent (ex. jardin-scolaire-2026).
      - name: title
        label: Titre
        widget: string
        required: true
      - name: year
        label: Année
        widget: string
        required: false
      - name: category
        label: Catégories
        widget: select
        required: false
        options: &id002
        - label: Agriculture
          value: agriculture
        - label: Environnement
          value: environment
        - label: Éducation
          value: education
        - label: Traduction
          value: translation
        - label: Leadership
          value: leadership
        - label: Communication
          value: communication
        - label: Numérique
          value: digital
        - label: Recherche
          value: research
        - label: Création de contenu
          value: content
        - label: Technologie
          value: technology
        - label: Événements
          value: events
        - label: Prise de parole
          value: speaking
        - label: Image professionnelle
          value: branding
        - label: Projets
          value: projects
        multiple: true
      - name: featured
        label: À la une (page d’accueil)
        widget: boolean
        required: false
        default: false
      - name: image
        label: Image principale
        widget: image
        required: false
      - name: summary
        label: Résumé (une ou deux phrases)
        widget: text
        required: false
      - name: description
        label: Description / histoire du projet
        widget: text
        required: false
      - name: objectives
        label: Objectifs
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      - name: role
        label: Mon rôle
        widget: text
        required: false
      - name: results
        label: Résultats
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      - name: tech
        label: Outils & technologies
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      - name: skills
        label: Compétences mobilisées
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      - name: link
        label: Lien (site du projet, article…)
        widget: string
        required: false
      - name: youtube
        label: Vidéo YouTube
        widget: string
        required: false
        hint: 'Identifiant YouTube seulement : pour https://www.youtube.com/watch?v=AbC123xyz, écrivez AbC123xyz.'
      - name: gallery
        label: Galerie photos
        widget: list
        required: false
        fields:
        - name: src
          label: Image
          widget: image
          required: true
        - name: alt
          label: Description
          widget: string
          required: false
        summary: '{{alt}}'
      - name: documents
        label: Documents (PDF…)
        widget: list
        required: false
        fields:
        - name: title
          label: Titre
          widget: string
          required: true
        - name: url
          label: Fichier
          widget: file
          required: false
        summary: '{{title}}'
      - &id003
        name: placeholder
        label: Exemple à remplacer
        widget: boolean
        required: false
        hint: Coché = entrée d’exemple (encadrée en pointillés, masquée quand le site est « prêt »).
        default: false
      - &id001
        name: draft
        label: Brouillon (masqué du site)
        widget: boolean
        required: false
        default: false
      summary: '{{year}} — {{title}}'
  - name: posts
    label: Blog — articles
    file: data/posts.json
    fields:
    - name: posts
      label: Articles
      widget: list
      required: false
      fields:
      - name: slug
        label: Adresse de l’article
        widget: string
        required: true
        hint: Minuscules, tirets, sans accent (ex. mon-premier-article). L’article sera à article.html?a=…
      - name: title
        label: Titre
        widget: string
        required: true
      - name: date
        label: Date
        widget: string
        required: false
        hint: Format AAAA-MM-JJ, ex. 2026-10-15.
      - name: category
        label: Catégorie
        widget: select
        required: false
        options:
        - Agriculture
        - Environnement
        - Education
        - Leadership
        - Communication
        - Translation
        - Technology
        multiple: false
      - name: image
        label: Image de couverture
        widget: image
        required: false
      - name: summary
        label: Résumé (affiché dans la liste)
        widget: text
        required: false
      - name: tags
        label: Mots-clés
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      - name: body
        label: Texte de l’article
        widget: markdown
        required: false
        hint: Titres, gras, listes, liens et images. Collez un lien YouTube seul sur une ligne pour intégrer la vidéo.
      - *id001
      summary: '{{date}} — {{title}}'
  - name: courses
    label: Formations
    file: data/courses.json
    fields:
    - name: courses
      label: Formations
      widget: list
      required: false
      fields:
      - name: id
        label: Identifiant
        widget: string
        required: true
        hint: Identifiant unique, en minuscules, sans espace ni accent (ex. jardin-scolaire-2026).
      - name: title
        label: Titre
        widget: string
        required: true
      - name: platform
        label: Plateforme
        widget: select
        required: false
        options:
        - label: POLE GEO-HAGRI
          value: geo-hagri
        - label: Autre
          value: autre
        multiple: false
      - name: category
        label: Catégorie
        widget: select
        required: false
        options: *id002
        multiple: false
      - name: description
        label: Description
        widget: text
        required: false
      - name: objectives
        label: Objectifs
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      - name: skills
        label: Compétences
        widget: list
        required: false
