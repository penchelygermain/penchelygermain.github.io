  format: json
  label: 🧩 Structure
  description: Piliers et catégories — à modifier avec précaution.
  files:
  - name: pillars
    label: Les 5 piliers & catégories
    file: data/pillars.json
    fields:
    - name: pillars
      label: Piliers
      widget: list
      required: false
      fields:
      - name: id
        label: Identifiant (ne pas modifier)
        widget: string
        required: false
