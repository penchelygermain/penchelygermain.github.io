      - name: tint
        label: Couleur
        widget: select
        required: false
        options: &id005
        - label: Vert (agronomie)
          value: var(--p1)
        - label: Bleu (formation)
          value: var(--p2)
        - label: Indigo (traduction)
          value: var(--p3)
        - label: Terre cuite (leadership)
          value: var(--p4)
        - label: Ocre (contenu)
          value: var(--p5)
        - label: Vert principal
          value: var(--primary)
        multiple: false
      - name: description
        label: Description
        widget: text
        required: false
      - name: audience
        label: Public cible
        widget: string
        required: false
      - name: deliverables
        label: Livrables
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
