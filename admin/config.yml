        label: Numéro
        widget: string
        required: false
      - name: icon
        label: Icône
        widget: select
        required: false
        options: *id004
        multiple: false
      - name: tint
        label: Couleur
        widget: select
        required: false
        options: *id005
        multiple: false
      - name: category
        label: Catégorie des projets liés
        widget: select
        required: false
        options: *id002
        multiple: false
      - name: title
        label: Titre
        widget: string
        required: true
      - name: page
        label: Page (ne pas modifier)
        widget: string
        required: false
      - name: role
        label: Rôle en une ligne
        widget: string
        required: false
      - name: text
        label: Description
        widget: text
        required: false
      - name: skills
        label: Mots-clés
        widget: list
        required: false
        field:
          name: item
          label: Élément
          widget: string
      summary: '{{no}} — {{title}}'
    - name: categories
      label: Catégories (filtres)
      widget: list
      required: false
      fields:
      - name: key
