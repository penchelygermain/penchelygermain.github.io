    - name: documents
      label: Documents
      widget: list
      required: false
      fields:
      - name: id
        label: Identifiant
        widget: string
        required: true
        hint: Identifiant unique, en minuscules, sans espace ni accent (ex. jardin-scolaire-2026).
      - name: title
        label: Titre
        widget: string
        required: true
      - name: description
        label: Description
        widget: text
        required: false
      - name: category
        label: Catégorie
        widget: string
        required: false
        hint: Ex. Profil, Formation, Agronomie…
      - name: date
        label: Date
        widget: string
        required: false
        hint: AAAA-MM
      - name: format
        label: Format
        widget: select
        required: false
        options:
        - PDF
        - DOCX
        - PPTX
        - XLSX
        - IMG
        - ZIP
        multiple: false
      - name: url
        label: Fichier
        widget: file
        required: false
        hint: Ou collez un lien externe (Google Drive, Zenodo…) pour les fichiers de plus de 10 Mo.
      - name: public
        label: Public
        widget: boolean
        required: false
        hint: Décoché = jamais affiché sur le site.
        default: true
      - *id003
      - *id001
