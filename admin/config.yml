      label: Groupes de compétences
      widget: list
      required: false
      fields:
      - name: group
        label: Nom du groupe
        widget: string
        required: true
      - name: items
        label: Compétences
        widget: list
        required: false
        fields:
        - name: name
          label: Compétence
          widget: string
          required: true
        - name: level
          label: Niveau
          widget: number
          required: false
          hint: 1 = Débutant, 2 = Intermédiaire, 3 = Avancé, 4 = Expert
          value_type: int
          min: 1
          max: 4
          default: 3
