        required: false
      - name: youtube
        label: Vidéo YouTube
        widget: string
        required: false
        hint: 'Identifiant YouTube seulement : pour https://www.youtube.com/watch?v=AbC123xyz, écrivez AbC123xyz.'
      - name: pdf
        label: Support PDF
        widget: file
        required: false
      - name: link
        label: Lien vers la formation
        widget: string
        required: false
      - *id003
      - *id001
