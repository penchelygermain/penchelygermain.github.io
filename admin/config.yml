      - name: title
        label: Titre
        widget: string
        required: true
      - name: date
        label: Date
        widget: string
        required: false
        hint: Format AAAA-MM-JJ, ex. 2026-10-15.
      - name: category
        label: Catégorie
        widget: select
        required: false
        options:
        - Articles
        - Vidéos
        - Podcasts
        - Formations
        - Infographies
        - Présentations
        - Publications scientifiques
        - Contenus éducatifs
